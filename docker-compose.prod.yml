# ============================================================================
# docker-compose.prod.yml - Production Environment
# Negative Space Imaging Project - Multi-Service Production Configuration
# ============================================================================
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml down
#
# IMPORTANT: Set all required environment variables in .env.prod before deployment
# ============================================================================

version: "3.8"

services:
  # ==========================================================================
  # PostgreSQL Database - Primary Data Store
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: nsi_postgres_prod
    environment:
      POSTGRES_USER: ${DB_USER:?Database user required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:-negative_space_prod}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nsi_admin} -d ${DB_NAME:-negative_space_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nsi_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=postgres,env=production"
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # Redis Cache - Session and Cache Store
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: nsi_redis_prod
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?Redis password required}
    volumes:
      - redis_data_prod:/data
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nsi_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=redis,env=production"
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # Python AI/ML Service
  # ==========================================================================
  python_service:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        PYTHON_VERSION: "3.11"
    image: nsi-python:${APP_VERSION:-latest}
    container_name: nsi_python_prod
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PYTHON_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-negative_space_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      WORKERS: ${PYTHON_WORKERS:-4}
    volumes:
      - uploads_prod:/app/uploads:rw
      - shared_data_prod:/app/shared_data:rw
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - nsi_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=python,env=production"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256M

  # ==========================================================================
  # Node.js Backend API
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        NODE_ENV: production
    image: nsi-api:${APP_VERSION:-latest}
    container_name: nsi_api_prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-negative_space_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PYTHON_SERVICE_URL: http://python_service:8000
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      NODE_OPTIONS: "--max-old-space-size=1024"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://negative-space.local}
      RATE_LIMIT: ${API_RATE_LIMIT:-1000}
    volumes:
      - uploads_prod:/app/uploads:rw
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - nsi_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=api,env=production"
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # React Frontend with Nginx
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NODE_ENV: production
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    image: nsi-frontend:${APP_VERSION:-latest}
    container_name: nsi_frontend_prod
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nsi_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=frontend,env=production"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64M
      - /var/run:size=16M

  # ==========================================================================
  # Nginx Reverse Proxy with SSL Termination
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: nsi_nginx_prod
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache_prod:/var/cache/nginx:rw
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nsi_internal
      - nsi_external
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=nginx,env=production"
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # Prometheus - Metrics Collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nsi_prometheus_prod
    user: "65534:65534"  # nobody user
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus:rw
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nsi_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=prometheus,env=production"
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # Grafana - Metrics Visualization
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: nsi_grafana_prod
    user: "472:472"  # grafana user
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Grafana password required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-https://monitoring.negative-space.local}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?Grafana secret key required}
      GF_DATABASE_TYPE: sqlite3
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
    volumes:
      - grafana_data_prod:/var/lib/grafana:rw
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - nsi_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=grafana,env=production"
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # Node Exporter - Host Metrics
  # ==========================================================================
  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: nsi_node_exporter_prod
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - nsi_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
        labels: "service=node_exporter,env=production"
    security_opt:
      - no-new-privileges:true
    pid: host

# ==========================================================================
# Volumes - Persistent Data Storage
# ==========================================================================
volumes:
  postgres_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/var/lib/nsi}/postgres

  redis_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/var/lib/nsi}/redis

  uploads_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/var/lib/nsi}/uploads

  shared_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/var/lib/nsi}/shared

  prometheus_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/var/lib/nsi}/prometheus

  grafana_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/var/lib/nsi}/grafana

  nginx_cache_prod:
    driver: local

# ==========================================================================
# Networks - Service Communication
# ==========================================================================
networks:
  # Internal network for service-to-service communication
  nsi_internal:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

  # External network for public-facing services
  nsi_external:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16

# ==========================================================================
# Secrets - Sensitive Data Management (Docker Swarm mode)
# ==========================================================================
# Uncomment for Docker Swarm deployment:
# secrets:
#   db_password:
#     external: true
#   redis_password:
#     external: true
#   jwt_secret:
#     external: true
#   grafana_password:
#     external: true
