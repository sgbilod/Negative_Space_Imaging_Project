[mutmut]
# Mutmut configuration for mutation testing
# Identifies survived mutations and areas for improvement

tests_dir = tests
mutation_operators = all

# Paths to mutate (critical modules only)
paths_to_mutate =
    quantum_processor.py
    negative_space_analysis/
    sovereign/
    security/
    api/api.py

# Coverage-driven mutation
use_coverage = true

# Run tests in parallel for speed
parallel = true

# Test this mode
test_command = pytest -x
baseline = baseline

# Report settings
output_file = mutation_report.json
show_mutants = true

# Excluded from mutation (not relevant to mutation testing)
skip =
    __pycache__
    .venv
    venv
    htmlcov
    .pytest_cache

# Timeout for each mutation test (seconds)
timeout = 30
timeout_multiplier = 1

# Mutations to exclude (less relevant)
exclude_mutations = DecoratorMutation,AugAssignMutation
