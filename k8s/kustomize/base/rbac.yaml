apiVersion: v1
kind: ServiceAccount
metadata:
  name: negative-space-sa
  namespace: negative-space
  labels:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: negative-space-role
  labels:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: negative-space-rolebinding
  labels:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: negative-space-role
subjects:
  - kind: ServiceAccount
    name: negative-space-sa
    namespace: negative-space
