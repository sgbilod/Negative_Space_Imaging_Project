apiVersion: v1
kind: Service
metadata:
  name: negative-space-api
  namespace: negative-space
  labels:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: negative-space-ml-processor
  namespace: negative-space
  labels:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: ml-processor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: ml-processor
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: negative-space-web-viewer
  namespace: negative-space
  labels:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: web-viewer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: web-viewer
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
