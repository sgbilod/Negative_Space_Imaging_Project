apiVersion: v1
kind: Secret
metadata:
  name: negative-space-secrets
  namespace: negative-space
  labels:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database Credentials (placeholder - use SealedSecrets or ExternalSecrets in overlays)
  DB_HOST: "postgres.default.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "negative_space_user"
  DB_PASSWORD: "PLACEHOLDER_CHANGE_IN_OVERLAY"
  DB_NAME: "negative_space_db"

  # API Keys and Tokens (placeholder)
  API_SECRET_KEY: "PLACEHOLDER_CHANGE_IN_OVERLAY"
  JWT_SECRET: "PLACEHOLDER_CHANGE_IN_OVERLAY"

  # Service Communication
  SERVICE_AUTH_TOKEN: "PLACEHOLDER_CHANGE_IN_OVERLAY"
---
