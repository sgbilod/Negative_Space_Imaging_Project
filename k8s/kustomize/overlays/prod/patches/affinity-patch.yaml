apiVersion: apps/v1
kind: Deployment
metadata:
  name: negative-space-api
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - negative-space
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - api
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: In
                    values:
                      - "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: negative-space-ml-processor
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - negative-space
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - ml-processor
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: gpu
                    operator: In
                    values:
                      - "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: negative-space-web-viewer
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - negative-space
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - web-viewer
                topologyKey: kubernetes.io/hostname
