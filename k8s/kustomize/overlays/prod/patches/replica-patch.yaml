apiVersion: apps/v1
kind: Deployment
metadata:
  name: negative-space-api
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: negative-space-ml-processor
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: ml-processor
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "1500m"
              memory: "1.5Gi"
            limits:
              cpu: "2500m"
              memory: "2.5Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: negative-space-web-viewer
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: web-viewer
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
