---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: negative-space-web-viewer-netpol
  namespace: negative-space
  labels:
    app.kubernetes.io/name: negative-space
    app.kubernetes.io/component: web-viewer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: negative-space
      app.kubernetes.io/component: web-viewer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: negative-space
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
          # HTTPS
