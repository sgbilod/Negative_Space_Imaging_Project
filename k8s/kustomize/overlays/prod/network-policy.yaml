spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: negative-space
      app.kubernetes.io/component: ml-processor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: negative-space
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
