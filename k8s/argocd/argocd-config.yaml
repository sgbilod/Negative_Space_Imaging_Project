---
# ArgoCD Server Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params
    app.kubernetes.io/instance: argocd
data:
  # Server settings
  server.insecure: "false"
  server.disable.auth: "false"
  # Repository server settings
  reposerver.allow.empty.lis: "false"
  # Application controller settings
  application.instanceLabelKey: argocd.argoproj.io/instance
  # Reconciliation settings
  server.disable.auth: "false"

---
# ArgoCD General Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/instance: argocd
data:
  # Admin dashboard URL
  admin.enabled: "true"
  # Disable anonymous access (require login)
  users.anonymous.enabled: "false"
  # Repository settings
  repositories: |
    - url: https://github.com/yourusername/Negative_Space_Imaging_Project
      type: git
      name: negative-space-repo
      username: $GITHUB_USERNAME
      password: $GITHUB_TOKEN
  # Webhook settings
  url: https://argocd.example.com
  # OIDC Configuration (GitHub OAuth2)
  oidc.config: |
    name: GitHub
    issuer: https://github.com
    clientID: <GITHUB_OAUTH_CLIENT_ID>
    clientSecret: <GITHUB_OAUTH_CLIENT_SECRET>
    requestedIDTokenClaims:
      groups_claim: admin
    requestedScopes:
      - openid
      - profile
      - email
  # Helm chart repository settings
  helm.repositories: |
    - name: stable
      url: https://charts.helm.sh/stable
    - name: bitnami
      url: https://charts.bitnami.com/bitnami
  # Kustomize settings
  kustomize.buildOptions: --load_restrictor=none
  # Resource tracking settings
  resourceTrackingMethod: annotation+label
  # Application defaults
  application.defaults: |
    project: default
    syncPolicy:
      automated:
        prune: false
        selfHeal: false
      syncOptions:
      - CreateNamespace=true
  # Health assessment rules
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.operationState ~= nil then
        if obj.status.operationState.finishedAt ~= nil then
          hs.status = "Success"
        end
      end
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message
      end
    end
    return hs
  # Notification settings
  url.openapidocs: https://cd.example.com/swagger-ui
  # Disable TLS verification for self-signed certs (development only)
  server.disable.tls: "false"

---
# ArgoCD RBAC Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/instance: argocd
data:
  # Default policy (deny all, allow specific roles)
  policy.default: role:readonly
  # Admin policy
  policy.csv: |
    # Read all resources
    p, role:readonly, applications, get, */*, allow
    p, role:readonly, repositories, get, *, allow
    p, role:readonly, logs, get, *, allow
    # Admin role - full access
    p, role:admin, *, *, */*, allow
    # Deployer role - can sync applications
    p, role:deployer, applications, sync, */*, allow
    p, role:deployer, applications, get, */*, allow
    # User assignments (map GitHub teams)
    g, admin-team, role:admin
    g, deployer-team, role:deployer
    g, developers-team, role:readonly
  # Scopes for user tokens
  scopes: '[groups]'
  # Policy enforcement mode
  policy.enforceMode: enforce

---
# ArgoCD Notifications Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-cm
    app.kubernetes.io/instance: argocd
data:
  # Notification triggers
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      oncePer: app.status.operationState.finishedAt
      sendNotification: true
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      oncePer: app.status.operationState.finishedAt
      sendNotification: true
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      oncePer: 300s
      sendNotification: true
  # Slack template
  template.slack-template: |
    message: |
      Application {{.app.metadata.name}} sync status is {{.app.status.operationState.phase}}
      {{if eq .app.status.operationState.phase "Succeeded"}}✅{{end}}
      {{if eq .app.status.operationState.phase "Failed"}}❌{{end}}
      Sync workflow ID: {{.app.metadata.uid}}
      Repository: {{.app.spec.source.repoURL}}
      Revision: {{.app.spec.source.targetRevision}}
      Author: {{(call .repo.GetCommitMetadata .app.spec.source.targetRevision).Author}}
    deliveryPolicy: Post
    groupingKey: "{{.app.metadata.name}}"
    notifyBroadcast: false

---
# Repository Credentials Secret (for private repos)
apiVersion: v1
kind: Secret
metadata:
  name: argocd-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
data:
  # Base64 encoded GitHub token
  password: <BASE64_GITHUB_TOKEN>
  type: Z2l0aA==  # "git" in base64
  url: aHR0cHM6Ly9naXRodWIuY29tL3lvdXJ1c2VybmFtZQ==  # GitHub URL
  username: PGJhc2U2NF9naXRodWJfdXNlcm5hbWU+
type: Opaque

---
# SSH Private Key for Git Access (alternative to HTTPS)
apiVersion: v1
kind: Secret
metadata:
  name: argocd-repo-ssh-key
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
data:
  # SSH private key (base64 encoded)
  sshPrivateKey: |
    <BASE64_SSH_PRIVATE_KEY>
type: Opaque

---
# GPG Keys for Signature Verification (optional)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-gpg-keys-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-gpg-keys-cm
    app.kubernetes.io/instance: argocd
data:
  # GPG public keys for commit signature verification
  4AEE18F83AFDEB23.pub: |
    -----BEGIN PGP PUBLIC KEY BLOCK-----
    # GPG key data here
    -----END PGP PUBLIC KEY BLOCK-----
