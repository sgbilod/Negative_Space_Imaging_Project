metadata:
  name: argocd-staging-deployer
  namespace: negative-space-staging
  labels:
    app.kubernetes.io/name: argocd-staging-deployer
    app.kubernetes.io/instance: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-staging-deployer
