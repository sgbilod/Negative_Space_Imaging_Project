---
# Notifications ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-cm
data:
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      oncePer: app.status.operationState.finishedAt
      sendNotification: true

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      oncePer: app.status.operationState.finishedAt
      sendNotification: true

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      oncePer: 300s
      sendNotification: true

  trigger.on-sync-running: |
    - when: app.status.operationState.phase in ['Running']
      oncePer: 5m
      sendNotification: true

  # Slack notification template
  template.slack: |
    message: |
      {{if eq .app.status.operationState.phase "Succeeded"}}✅{{else}}{{if eq .app.status.operationState.phase "Failed"}}❌{{else}}⏳{{end}}{{end}} Application {{.app.metadata.name}} sync status is {{.app.status.operationState.phase}}
      Repository: {{.app.spec.source.repoURL}}
      Revision: {{.app.spec.source.targetRevision}}
      {{if ne .app.spec.destination.server "https://kubernetes.default.svc"}}Server: {{.app.spec.destination.server}}{{end}}
      {{if ne .app.spec.destination.namespace "default"}}Namespace: {{.app.spec.destination.namespace}}{{end}}
    deliveryPolicy: Post
    groupingKey: "{{.app.metadata.name}}"
    notifyBroadcast: false

  # Email notification template
  template.email: |
    message: |
      <h2>{{ if eq .app.status.operationState.phase "Succeeded" }}✅{{ else if eq .app.status.operationState.phase "Failed" }}❌{{ else }}⏳{{ end }} ArgoCD Deployment Notification</h2>
      <p><strong>Application:</strong> {{.app.metadata.name}}</p>
      <p><strong>Status:</strong> {{.app.status.operationState.phase}}</p>
      <p><strong>Repository:</strong> {{.app.spec.source.repoURL}}</p>
      <p><strong>Revision:</strong> {{.app.spec.source.targetRevision}}</p>
      {{if .app.spec.destination.namespace}}<p><strong>Namespace:</strong> {{.app.spec.destination.namespace}}</p>{{end}}
      {{if .app.status.operationState.message}}<p><strong>Message:</strong> {{.app.status.operationState.message}}</p>{{end}}

  # GitHub notification template
  template.github: |
    message: |
      {{if eq .app.status.operationState.phase "Succeeded"}}✅ Deployment succeeded{{else}}{{if eq .app.status.operationState.phase "Failed"}}❌ Deployment failed{{else}}⏳ Deployment in progress{{end}}{{end}}

      Application: {{.app.metadata.name}}
      Status: {{.app.status.operationState.phase}}
      Repository: {{.app.spec.source.repoURL}}

  # Microsoft Teams notification template
  template.teams: |
    message: |
      {{if eq .app.status.operationState.phase "Succeeded"}}✅ Deployment Success{{else}}{{if eq .app.status.operationState.phase "Failed"}}❌ Deployment Failed{{else}}⏳ Deployment In Progress{{end}}{{end}}

      Application: {{.app.metadata.name}}
      Status: {{.app.status.operationState.phase}}
      Repository: {{.app.spec.source.repoURL}}
      Revision: {{.app.spec.source.targetRevision}}

---
# Slack Integration Secret
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-slack
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-slack
type: Opaque
data:
  # Base64 encoded Slack webhook URL
  slack-token: "aHR0cHM6Ly9ob29rcy5zbGFjay5jb20vc2VydmljZXMvVDAwMDAwMDAwL0IwMDAwMDAwMC9YVHH5dDAwMDAwMDAwMDAwMDAwMDA="

---
# Slack Notification Service Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-slack-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-slack-config
data:
  slack-channels: |
    - name: general
      channel: "#negative-space-notifications"
      environments: [dev, staging, prod]
    - name: deployments
      channel: "#deployments"
      environments: [staging, prod]
    - name: alerts
      channel: "#alerts"
      environments: [prod]

  slack-triggers: |
    - event: sync-succeeded
      channel: deployments
      template: slack
      conditions:
        - environments: [prod]
          channel: alerts

    - event: sync-failed
      channel: alerts
      template: slack
      severity: critical

    - event: health-degraded
      channel: alerts
      template: slack
      severity: warning

---
# Email Notification Service Configuration
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-email
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-email
type: Opaque
data:
  smtp-host: "c21RdC5leGFtcGxlLmNvbQ==" # smtp.example.com
  smtp-port: "NTg3" # 587
  smtp-username: "bm90aWZpY2F0aW9uc0BleGFtcGxlLmNvbQ==" # notifications@example.com
  smtp-password: "cGFzc3dvcmQtaGVyZQ==" # password-here

---
# Email Trigger Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-email-triggers
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-email-triggers
data:
  email-recipients: |
    - event: sync-succeeded
      environments: [prod]
      recipients:
        - ops-team@example.com
        - devops@example.com

    - event: sync-failed
      environments: [prod, staging]
      recipients:
        - ops-team@example.com
        - devops@example.com
        - on-call@example.com

    - event: health-degraded
      environments: [prod]
      recipients:
        - on-call@example.com

---
# GitHub Status Update Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-github-status
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-github-status
data:
  github-status-updates: |
    - enabled: true
      events:
        - sync-succeeded
        - sync-failed
      environments: [all]
      include-revision: true

---
# Notification Service Monitor (Prometheus metrics)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-metrics
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-metrics
data:
  metrics-config: |
    metrics:
      - name: argocd_notifications_sent_total
        help: Total notifications sent
        type: counter

      - name: argocd_notifications_failed_total
        help: Total failed notifications
        type: counter

      - name: argocd_notification_delivery_seconds
        help: Notification delivery time in seconds
        type: histogram
