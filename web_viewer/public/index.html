<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Negative Space Imaging Viewer - Advanced Medical Image Analysis with Quantum Processing" />

  <!-- Preload critical resources -->
  <link rel="preload" href="%PUBLIC_URL%/favicon.ico" as="image" />

  <!-- OHIF Cornerstone dependencies -->
  <script src="https://unpkg.com/cornerstone-core@2.3.0/dist/cornerstone.min.js"></script>
  <script src="https://unpkg.com/cornerstone-math@0.1.10/dist/cornerstoneMath.min.js"></script>
  <script src="https://unpkg.com/cornerstone-tools@6.0.8/dist/cornerstoneTools.min.js"></script>
  <script src="https://unpkg.com/cornerstone-wado-image-loader@4.13.2/dist/cornerstoneWADOImageLoader.min.js"></script>
  <script src="https://unpkg.com/dicom-parser@1.8.21/dist/dicomParser.min.js"></script>

  <!-- OHIF Web Worker -->
  <script>
    // Initialize web workers for OHIF
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            console.log('OHIF ServiceWorker registered');
          })
          .catch(function(error) {
            console.log('OHIF ServiceWorker registration failed');
          });
      });
    }
  </script>

  <title>Negative Space Imaging Viewer</title>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!-- Main application container -->
  <div id="root"></div>

  <!-- Loading screen -->
  <div id="loading-screen" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    color: #00ff88;
    font-family: 'Segoe UI', sans-serif;
  ">
    <div style="
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 255, 136, 0.3);
      border-radius: 50%;
      border-top-color: #00ff88;
      animation: spin 1s linear infinite;
      margin-bottom: 2rem;
    "></div>

    <h1 style="margin-bottom: 1rem; font-size: 2rem;">Negative Space Imaging</h1>
    <p style="margin-bottom: 2rem; opacity: 0.8;">Initializing Advanced Medical Image Analysis...</p>

    <div id="loading-progress" style="
      width: 300px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    ">
      <div style="
        width: 0%;
        height: 100%;
        background: #00ff88;
        border-radius: 2px;
        animation: progress 3s ease-out forwards;
      "></div>
    </div>
  </div>

  <!-- Error boundary fallback -->
  <script>
    window.addEventListener('error', function(e) {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.innerHTML = `
          <div style="text-align: center; color: #ff4444;">
            <h2>Application Error</h2>
            <p>Failed to load Negative Space Imaging Viewer</p>
            <p style="font-size: 0.9rem; opacity: 0.7;">${e.message}</p>
            <button onclick="window.location.reload()" style="
              margin-top: 1rem;
              padding: 0.5rem 1rem;
              background: #ff4444;
              color: white;
              border: none;
              border-radius: 4px;
              cursor: pointer;
            ">Reload Application</button>
          </div>
        `;
      }
    });

    // Hide loading screen when React mounts
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.display = 'none';
        }
      }, 1000);
    });
  </script>

  <!-- Animations -->
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes progress {
      to { width: 100%; }
    }

    /* Ensure proper viewport handling for medical images */
    @media screen and (max-width: 768px) {
      #root {
        touch-action: manipulation;
      }
    }

    /* High DPI display support */
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    }
  </style>
</body>
</html>
