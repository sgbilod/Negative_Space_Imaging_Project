# ============================================================================
# Setup Configuration
# Negative Space Imaging Project
# Copyright (c) 2025 Stephen Bilodeau. All rights reserved.
# ============================================================================

[metadata]
name = negative-space-imaging
version = 1.0.0
author = Stephen Bilodeau
author_email = stephen@negative-space.io
description = Advanced negative space detection and analysis for imaging applications
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/negative-space-imaging/negative-space-imaging
project_urls =
    Bug Reports = https://github.com/negative-space-imaging/issues
    Documentation = https://docs.negative-space.io
    Source = https://github.com/negative-space-imaging/negative-space-imaging
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: Other/Proprietary License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Image Processing
    Topic :: Scientific/Engineering :: Artificial Intelligence
keywords = negative-space, imaging, image-processing, computer-vision, deep-learning

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24.0
    scipy>=1.11.0
    pillow>=10.0.0
    pyyaml>=6.0.0
    aiohttp>=3.8.0

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-asyncio>=0.21.0
    black>=23.7.0
    flake8>=6.1.0
    mypy>=1.4.0
    isort>=5.12.0

hpc =
    dask[distributed]>=2023.1.0
    ray>=2.5.0
    mpi4py>=3.1.0

gpu =
    cupy-cuda12x>=12.0.0
    torch>=2.0.0

medical =
    pydicom>=2.4.0
    h5py>=3.9.0

astronomy =
    astropy>=5.3.0
    astroquery>=0.4.0

all =
    %(dev)s
    %(hpc)s
    %(medical)s
    %(astronomy)s

[options.entry_points]
console_scripts =
    nsi = cli:main
    nsi-demo = pipeline_demo:main
    nsi-hpc = hpc_integration_example:main

[options.package_data]
* = *.yaml, *.json

# ============================================================================
# Tool Configurations
# ============================================================================

[flake8]
max-line-length = 100
extend-ignore = E203, E501, W503
exclude =
    .git,
    __pycache__,
    .venv,
    .venv-hpc,
    build,
    dist,
    *.egg-info,
    node_modules

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = (tests/|\.venv/)

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[isort]
profile = black
line_length = 100
skip = .venv,.venv-hpc,node_modules
known_first_party = negative_space

[coverage:run]
branch = True
source = .
omit =
    tests/*
    .venv/*
    .venv-hpc/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
